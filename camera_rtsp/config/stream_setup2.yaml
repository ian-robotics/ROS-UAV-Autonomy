# Set up your streams to rtsp here.
port: "8555"
streams: # Cannot rename - must leave this as is.

  stream-x:
    type: cam
    source: "v4l2src device=/dev/video0 ! videoconvert ! videoscale ! video/x-raw,framerate=15/1,width=640,height=480"
    #source: v4l2src device=/dev/video0 ! videoconvert
    mountpoint: /front
    bitrate: 500

  stream-yay:
    type: topic
    #source: /yolov8/detection_image
    source: /second/usb_cam/image_raw
    mountpoint: /back
    caps: video/x-raw,framerate=10/1,width=640,height=480
    bitrate: 500

